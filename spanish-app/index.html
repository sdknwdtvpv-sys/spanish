<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingua · 西班牙语学习 | Aprende Español</title>
  <meta name="description" content="极简沉浸式西班牙语学习应用 - 分级课程、单词记忆、语法练习、口语跟读、听力训练、社区交流">
  <meta name="theme-color" content="#1C1C1E">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇪🇸</text></svg>">
</head>
<body>
  <!-- 登录页面容器 -->
  <div id="auth-page" style="display:none;"></div>
  
  <!-- 主应用容器 -->
  <div id="app" style="opacity:1; transition: opacity 0.15s ease;"></div>
  
  <!-- 加载提示 -->
  <div id="loader" style="position:fixed;inset:0;background:#FAF8F4;display:flex;align-items:center;justify-content:center;z-index:9999;">
    <div style="text-align:center;">
      <div style="font-family:'Playfair Display',serif;font-size:3rem;font-weight:600;color:#1C1C1E;margin-bottom:8px;">
        Lingua<span style="color:#E63946;font-style:italic;">.</span>
      </div>
      <div style="color:#6B6B70;font-size:0.85rem;letter-spacing:0.1em;">CARGANDO...</div>
    </div>
  </div>
  
  <!-- 脚本 -->
  <script src="data/courses.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 移除加载动画
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loader');
        loader.style.transition = 'opacity 0.5s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }, 600);
    });
  </script>
</body>
</html>
