<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingua · 西班牙语学习 | Aprende Español</title>
  <meta name="description" content="极简沉浸式西班牙语学习应用 - 分级课程、单词记忆、语法练习、口语跟读、听力训练、社区交流">
  <meta name="theme-color" content="#F6F1E7">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lingua">
</head>
<body>
  <!-- 登录页面容器 -->
  <div id="auth-page" class="auth-page" style="display:none;"></div>
  
  <!-- 主应用容器 -->
  <div id="app" style="opacity:1; transition: opacity 0.15s ease;"></div>
  
  <!-- 加载提示 -->
  <div id="loader" style="position:fixed;inset:0;background:#F6F1E7;display:flex;align-items:center;justify-content:center;z-index:9999;">
    <div style="text-align:center;">
      <div style="font-family:'Fraunces','Noto Serif SC',Georgia,serif;font-size:3rem;font-weight:600;color:#221A12;margin-bottom:10px;letter-spacing:-0.02em;">
        Lingua<span style="color:#C0563A;font-style:italic;">.</span>
      </div>
      <div style="color:#93856F;font-size:0.78rem;letter-spacing:0.22em;font-family:'Instrument Sans','Noto Sans SC',system-ui,sans-serif;">CARGANDO…</div>
    </div>
  </div>
  
  <!-- 脚本 -->
  <script src="data/courses.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 移除加载动画
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loader');
        loader.style.transition = 'opacity 0.5s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }, 600);
    });

    // 注册 Service Worker（PWA 离线能力；Capacitor 原生壳内跳过）
    if ('serviceWorker' in navigator && !window.Capacitor &&
        (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
